name: Version

# Pull requests into staging carry a snapshot version (X.Y.Z-snapshot.N) and
# publish a GitHub pre-release when merged. Pull requests into main carry a
# stable version (X.Y.Z) and publish the release that HACS installs by default.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # also fetches the release tags
      - run: python3 .github/scripts/version.py check

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/version.py release
        env:
          GH_TOKEN: ${{ github.token }}
