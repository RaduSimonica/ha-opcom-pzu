# Today's prices as columns coloured by level, with your buy price as a line.
# Needs apexcharts-card (HACS -> Frontend). The colour thresholds are in
# RON/kWh: adjust them to your taste (and to EUR if you chose that).
# For tomorrow: use sensor.opcom_pzu_prices_tomorrow and add `offset: +1d`
# to `span`.
type: custom:apexcharts-card
header:
  show: true
  title: PZU prices today
  show_states: true
  colorize_states: true
graph_span: 24h
span:
  start: day
now:
  show: true
  label: Now
  color: "#e74c3c"
apex_config:
  plotOptions:
    bar:
      colors:
        ranges:
          - { from: -100, to: 0.45, color: "#2ed573" }
          - { from: 0.450001, to: 1, color: "#ffd32a" }
          - { from: 1.000001, to: 2, color: "#ffa550" }
          - { from: 2.000001, to: 100, color: "#9b59b6" }
series:
  - entity: sensor.opcom_pzu_prices_today
    name: Spot price
    type: column
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.prices || []).map(p => [new Date(p.start).getTime(), p.spot]);
  - entity: sensor.opcom_pzu_prices_today
    name: Buy price
    type: line
    curve: stepline
    color: "#ff4757"
    stroke_width: 3
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.prices || []).map(p => [new Date(p.start).getTime(), p.buy]);
