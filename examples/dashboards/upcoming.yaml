# Every price from now on: the rest of today, and tomorrow once OPCOM has
# published it (around 13:45). One entity, so the chart follows the clock.
# Needs apexcharts-card (HACS -> Frontend). Change graph_span (e.g. 36h, 48h)
# to see more of tomorrow.
type: custom:apexcharts-card
header:
  show: true
  title: PZU prices from now
  show_states: true
  colorize_states: true
graph_span: 24h
span:
  start: minute
now:
  show: true
  label: Now
  color: "#e74c3c"
apex_config:
  plotOptions:
    bar:
      colors:
        ranges:
          - { from: -100, to: 0.45, color: "#2ed573" }
          - { from: 0.450001, to: 1, color: "#ffd32a" }
          - { from: 1.000001, to: 2, color: "#ffa550" }
          - { from: 2.000001, to: 100, color: "#9b59b6" }
series:
  - entity: sensor.opcom_pzu_upcoming_prices
    name: Spot price
    type: column
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.prices || []).map(p => [new Date(p.start).getTime(), p.spot]);
  - entity: sensor.opcom_pzu_upcoming_prices
    name: Buy price
    type: line
    curve: stepline
    color: "#ff4757"
    stroke_width: 3
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.prices || []).map(p => [new Date(p.start).getTime(), p.buy]);
  - entity: sensor.opcom_pzu_upcoming_prices
    name: Sell price
    type: line
    curve: stepline
    color: "#1e90ff"
    stroke_width: 2
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.prices || []).map(p => [new Date(p.start).getTime(), p.sell]);
